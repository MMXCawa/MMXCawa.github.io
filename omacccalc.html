<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osu! Mania精准度计算器,可用于计算osu! Mania的精准度,不管是Stable还是Lazer都可以使用!</title>
    <style>
        /* 清爽风格CSS */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f8f9fa;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #34495e;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #2980b9;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #ecf0f1;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>osu! Mania精准度计算器</h1>
        <form id="calculatorForm">
            <div class="input-group">
                <label for="a">彩300：</label>
                <input type="number" id="a" required>
            </div>
            <div class="input-group">
                <label for="b">金300：</label>
                <input type="number" id="b" required>
            </div>
            <div class="input-group">
                <label for="c">200：</label>
                <input type="number" id="c" required>
            </div>
            <div class="input-group">
                <label for="d">100：</label>
                <input type="number" id="d" required>
            </div>
            <div class="input-group">
                <label for="e">50：</label>
                <input type="number" id="e" required>
            </div>
            <div class="input-group">
                <label for="f">Miss：</label>
                <input type="number" id="f" required>
            </div>
            <button type="submit">计算准度</button>
        </form>
        <div id="result"></div>
    </div>

<script>
document.getElementById('calculatorForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // 获取并验证输入值
    const inputs = ['a','b','c','d','e','f'];
    let values = [];
    for(let id of inputs) {
        const val = parseFloat(document.getElementById(id).value);
        if(isNaN(val)) {
            alert('请输入有效数字！');
            return;
        }
        values.push(val);
    }

    // 计算分子（加权和）
    const weightedSum = 300*values[0] + 300*values[1] + 
                       200*values[2] + 100*values[3] + 
                        50*values[4] + 0*values[5];
const weightedSum2 = 305*values[0] + 300*values[1] + 
                       200*values[2] + 100*values[3] + 
                        50*values[4] + 0*values[5];
    // 计算分母（总和乘以300）
    const totalSum = values.reduce((sum, num) => sum + num, 0);
    const denominator = 300 * totalSum;
     const denominator2 = 305 * totalSum;

    // 错误处理
    if(denominator === 0) {
        alert('分母不能为零！');
        return;
    }

    // 计算G值
    const g = weightedSum / denominator;

    // 格式化显示结果（保留2位小数）
    document.getElementById('result').innerHTML = `
        <p>准度计算结果(V1/Stable)：</p>
        <h2>${(g*100).toFixed(2)}%</h2>
        <p>准度计算结果(V2/Lazer)：</p>
        <h2>${(weightedSum2/denominator2*100).toFixed(2)}%</h2>`;
});
</script>
</body>
</html>
