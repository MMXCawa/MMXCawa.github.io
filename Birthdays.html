<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 冰火圈生日日历</title>

<style>
:root {
  --bg-page:#f4f7fb;--bg-card:#fff;--bg-empty:#f0f2f5;
  --text-main:#222;--text-sub:#555;--accent:#4a90e2;
  --today:#ffd700;--next:#c6f6d5;--search:#cce5ff;
}
body.dark{
  --bg-page:#1a1c22;--bg-card:#24262e;--bg-empty:#2a2d36;
  --text-main:#e4e6eb;--text-sub:#aaa;--accent:#6ea8ff;
  --today:#b8860b;--next:#1f3328;--search:#1a3a5f;
}
body{margin:0;padding:16px;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-page);color:var(--text-main);transition:.3s}
header{text-align:center;margin-bottom:12px}
h1{margin:0;font-size:clamp(1.4rem,4vw,2rem)}
.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
input.search{padding:6px 10px;border-radius:6px;border:1px solid #ccc;width:220px}
button.toggle{padding:6px 12px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer}
.countdown{font-size:.9rem;margin-top:6px;color:var(--accent)}

.calendar{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
@media(min-width:1080px){.calendar{grid-template-columns:repeat(4,1fr)}}

.month{background:var(--bg-card);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden}
.month-header{background:var(--accent);color:#fff;padding:10px;text-align:center;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{height:70px;border:1px solid #ddd;text-align:center;vertical-align:top;padding:4px;cursor:pointer;position:relative}
th{font-size:.8rem;background:#eee}
body.dark th{background:#2f313a}
.date{font-weight:700;font-size:.95rem;display:inline-block;margin-right:4px}
.birthday{font-size:.72rem;color:var(--text-sub);word-break:break-word}
.lunar-tag{font-size:.65rem;opacity:.7;margin-left:2px}
td.empty{background:repeating-linear-gradient(45deg,var(--bg-empty),var(--bg-empty) 4px,#e8ebf2 4px,#e8ebf2 5px);cursor:default}
.today{background:var(--today)!important;border:2px solid #daa520!important}
.today::before{content:'👑';position:absolute;top:2px;right:3px;font-size:.7rem}
.next-birthday{background:var(--next)!important;border:2px solid #38a169}
.search-hit{background:var(--search)!important;border:2px solid #007bff}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99}
.modal{background:var(--bg-card);color:var(--text-main);padding:18px 20px;border-radius:10px;width:90%;max-width:320px}
.close-btn{text-align:right;margin-top:12px}
.close-btn button{padding:4px 10px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
</style>
</head>

<body>
<div class="top-bar">
  <input class="search" placeholder="🔍 搜索名字…" oninput="searchName(this.value)">
  <button class="toggle" onclick="toggleTheme()">🌙 夜间模式</button>
</div>

<header>
  <h1>2026 冰火圈生日日历</h1>
  <div class="countdown" id="countdown"></div>
</header>

<div class="calendar" id="calendar"></div>

<div class="modal-mask" id="modal" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="close-btn"><button onclick="closeModal()">关闭</button></div>
  </div>
</div>

<script>
/* ===== 2026 农历各月初一 → 对应公历 Date 的锚点 =====
   正月=1 初一=2026-02-17 …… 腊月=12 初一=2027-01-08
   2026 丙午马年 无闰月
*/
const LUNAR_FIRST_DAY = [
  null,                                  // [0] 占位
  new Date(2026,1,17),  // [1] 正月初一 = 2/17
  new Date(2026,2,19),  // [2] 二月初一 = 3/19
  new Date(2026,3,17),  // [3] 三月初一 = 4/17
  new Date(2026,4,16),  // [4] 四月初一 = 5/16
  new Date(2026,5,15),  // [5] 五月初一 = 6/15
  new Date(2026,6,14),  // [6] 六月初一 = 7/14
  new Date(2026,7,13),  // [7] 七月初一 = 8/13
  new Date(2026,8,11),  // [8] 八月初一 = 9/11
  new Date(2026,9,10),  // [9] 九月初一 = 10/10
  new Date(2026,10,9), // [10] 十月初一 = 11/9
  new Date(2026,11,9), // [11] 冬月初一 = 12/9
  new Date(2027,0,8),   // [12] 腊月初一 = 2027/1/8（跨年，渲染时会跳过/标注）
];

/** 农历月日 → 公历 {year,month,day}（仅 2026 显示范围内有效） */
function lunarToSolar(lunarMonth, lunarDay){
  const anchor = LUNAR_FIRST_DAY[lunarMonth];
  if(!anchor) return null;
  const d = new Date(anchor);
  d.setDate(d.getDate() + (lunarDay - 1));
  return { year: d.getFullYear(), month: d.getMonth()+1, day: d.getDate() };
}

/* ============ 加载 JSON ============ */
const CAL_YEAR = 2026;
const map = new Map();   // key `${m}-${d}` → [ {name,type,note} ]
const cells = {};
let allEntries = [];     // 扁平化后的 [{name, month, day, type, note}]

fetch('birthdays.json')
  .then(r => {
    if(!r.ok) throw Error('找不到 birthdays.json（需用 Live Server / GitHub Pages 打开）');
    return r.json();
  })
  .then(data => {
    data.forEach(entry => {
      if(entry.type === 'lunar'){
        const s = lunarToSolar(entry.lunarMonth, entry.lunarDay);
        if(!s || s.year !== CAL_YEAR) return;
        push(s.month, s.day, entry.name, 'lunar', entry.note || `农历${entry.lunarMonth}月${toChineseNum(entry.lunarDay)}`);
      } else {
        // ✅ 关键修复：支持阳历 note
        push(entry.solarMonth, entry.solarDay, entry.name, 'solar', entry.note || null);
      }
    });
    createCalendar();
  })

function push(m,d,name,type,note){
  const k = `${m}-${d}`;
  if(!map.has(k)) map.set(k, []);
  map.get(k).push({ name, type, note });
  allEntries.push({ name, month:m, day:d, type, note });
}

function toChineseNum(n){
  const c=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
           '十一','十二','十三','十四','十五','十六','十七','十八','十九',
           '二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
  return c[n]||n;
}

/* ============ 渲染 ============ */
const today = new Date();

function createCalendar(){
  const cal = document.getElementById('calendar');
  const dim = [31,28,31,30,31,30,31,31,30,31,30,31]; // 2026平年
  let wd = new Date(CAL_YEAR,0,1).getDay();

  let next=null, minDiff=Infinity;

  for(let m=0;m<12;m++){
    const box = document.createElement('div');
    box.className='month';
    box.innerHTML=`\
      <div class="month-header">${m+1}月 ${CAL_YEAR}</div>\
      <table><thead><tr>${['日','一','二','三','四','五','六'].map(x=>`<th>${x}</th>`).join('')}</tr></thead>\
      <tbody></tbody></table>`;
    const tb = box.querySelector('tbody');
    let tr = document.createElement('tr');

    for(let i=0;i<wd;i++) tr.appendChild(empty());

    for(let d=1;d<=dim[m];d++){
      const td = document.createElement('td');
      td.dataset.key = `${m+1}-${d}`;
      td.innerHTML = `<div class="date">${d}</div>`;

      const list = map.get(td.dataset.key);
      if(list && list.length){
        // 清洗空名
        const names = list.map(x=>x.name).filter(Boolean);
        const tags  = list.map(x=> x.type==='lunar' ? `<span class="lunar-tag">(农历)</span>` : '');
        td.innerHTML += `<div class="birthday">${names.map((n,i)=>n+(tags[i]||'')).join('、')}</div>`;

        const diff = Math.ceil((new Date(CAL_YEAR,m,d)-today)/86400000);
        if(diff>=0 && diff<minDiff){ minDiff=diff; next=td; }
      }

      if(today.getFullYear()===CAL_YEAR && today.getMonth()===m && today.getDate()===d){
        td.classList.add('today');
      }

      cells[td.dataset.key]=td;
      td.onclick = ()=> openModal(m+1,d, list||null);
      tr.appendChild(td);
      wd=(wd+1)%7;
      if(wd===0&&d!==dim[m]){ tb.appendChild(tr); tr=document.createElement('tr'); }
    }
    while(tr.children.length<7) tr.appendChild(empty());
    tb.appendChild(tr);
    cal.appendChild(box);
  }

  if(next){
    next.classList.add('next-birthday');
    document.getElementById('countdown').textContent =
      minDiff===0 ? '🎉 今天就有生日！' : `⏳ 距离下一个生日还有 ${minDiff} 天`;
  } else {
    document.getElementById('countdown').textContent = '今年没有更多生日了 🎂';
  }
}

function empty(){ const td=document.createElement('td'); td.className='empty'; return td; }

/* ============ 搜索 / 弹窗 / 主题 ============ */
function searchName(k){
  Object.values(cells).forEach(c=>c.classList.remove('search-hit'));
  if(!k)return;
  const kw=k.toLowerCase();
  allEntries.forEach(e=>{
    if(e.name.toLowerCase().includes(kw))
      cells[`${e.month}-${e.day}`]?.classList.add('search-hit');
  });
}
function openModal(m,d,list){
  document.getElementById('modalTitle').textContent=`${m}月${d}日`;
  document.getElementById('modalBody').innerHTML =
    list?.length ? `<ul>${list.map(x=>`<li>${x.name}${x.note?`<br><small style="opacity:.7">${x.note}</small>`:''}</li>`).join('')}</ul>`
               : '暂无生日';
  document.getElementById('modal').style.display='flex';
}
function closeModal(){ document.getElementById('modal').style.display='none'; }
function toggleTheme(){ document.body.classList.toggle('dark'); }
</script>
</body>
</html>
